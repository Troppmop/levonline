name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest -q

  backend-migration-check:
    # Runs the real Alembic migration against a live Postgres, catching
    # anything sqlite-backed unit tests can't (e.g. Postgres-only DDL like
    # native ENUM types).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: levlachayal
          POSTGRES_PASSWORD: levlachayal
          POSTGRES_DB: levlachayal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U levlachayal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://levlachayal:levlachayal@localhost:5432/levlachayal
      - name: Verify downgrade is also clean
        run: alembic downgrade base
        env:
          DATABASE_URL: postgresql+asyncpg://levlachayal:levlachayal@localhost:5432/levlachayal

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
